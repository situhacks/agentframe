<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" role="img" aria-labelledby="title desc">
  <title id="title">AgentFrame</title>
  <desc id="desc">A file-native AI workspace for context, projects, and agents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f5ef"/>
      <stop offset="1" stop-color="#eef2ef"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#17201d" stroke-opacity="0.055"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#17201d" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1600" height="480" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="480" rx="28" fill="url(#grid)"/>

  <g transform="translate(1110 72)" filter="url(#shadow)">
    <rect width="350" height="336" rx="24" fill="#171b1a"/>
