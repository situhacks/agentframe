    <text x="80" y="49" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#171b1a">PROJECT</text>
    <rect x="28" y="84" width="294" height="62" rx="14" fill="#252b29"/>
    <circle cx="54" cy="115" r="8" fill="#ff8fa3"/>
    <rect x="76" y="104" width="170" height="9" rx="4.5" fill="#f7f5ef" fill-opacity="0.92"/>
    <rect x="76" y="122" width="112" height="7" rx="3.5" fill="#f7f5ef" fill-opacity="0.35"/>
    <rect x="28" y="162" width="294" height="62" rx="14" fill="#252b29"/>
    <circle cx="54" cy="193" r="8" fill="#78dce8"/>
    <rect x="76" y="182" width="204" height="9" rx="4.5" fill="#f7f5ef" fill-opacity="0.92"/>
    <rect x="76" y="200" width="142" height="7" rx="3.5" fill="#f7f5ef" fill-opacity="0.35"/>
    <rect x="28" y="240" width="294" height="68" rx="14" fill="#252b29"/>
    <circle cx="54" cy="274" r="8" fill="#d9ff6b"/>
    <rect x="76" y="260" width="154" height="9" rx="4.5" fill="#f7f5ef" fill-opacity="0.92"/>
    <rect x="76" y="278" width="218" height="7" rx="3.5" fill="#f7f5ef" fill-opacity="0.35"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" fill="#171b1a">
    <text x="116" y="193" font-size="104" font-weight="800" letter-spacing="-5">AgentFrame</text>
    <text x="122" y="252" font-size="28" font-weight="500" fill="#39423f">A file-native AI workspace for context, projects, and agents.</text>
  </g>

  <g transform="translate(120 306)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#171b1a" letter-spacing="0.3">
